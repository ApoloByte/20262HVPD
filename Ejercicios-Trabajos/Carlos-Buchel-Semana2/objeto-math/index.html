<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Objeto Math</title>
</head>

<body>



    
    <h1>Número aleatorio</h1>
    <h2>Ejercicio 1</h2>

      <button id="generar">Generar número</button>
      <p id="resultado"></p>





    <h1>Número entero aleatorio</h1>
    <h2>Ejercicio 2</h2>

        <button id="generarEntero">Generar número entero</button>
        <p id="resultadoEntero"></p>





    <h1>Generar Número entero aleatorio entre dos valores</h1>
    <h2>Ejercicio 3</h2>

       <label>Mínimo:</label>
       <input type="number" id="minimo">
       <label>Máximo:</label>
       <input type="number" id="maximo">
       <button id="generarRango">Generar número</button>
       <p id="resultadoRango"></p>





    <h1>Funciones de redondeo</h1>
    <h2>Ejercicio 4</h2>
    
    <label>Número:</label>
    <input type="number" id="numeroRedondear" step="0.01">
    <button id="redondear">Redondear</button>
    <p id="resultadoRedondeo"></p>
    
    
    

    
    <h1>Potencias</h1>
    <h2>Ejercicio 5</h2>
    
    <button id="calcularPotencias">Calcular potencias</button>
    <p id="resultadoPotencias"></p>
    
    


    
    <h1>Raíces cuadradas</h1>
    <h2>Ejercicio 6</h2>

    <button id="calcularRaices">Calcular raíces</button>
    <p id="resultadoRaices"></p>



    <script src="app.js"></script>

</body>

</html>
